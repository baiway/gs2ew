[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gs2ew"
version = "0.1.0"
description = "Hodge-podge of analysis scripts for the gyrokinetic code GS2."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dask>=2024.1.0",
    "imageio[ffmpeg]>=2.37.3",
    "matplotlib>=3.10.8",
    "netcdf4>=1.7.3",
    "numpy>=2.2.6",
    "xarray>=2025.6.1",
]

[project.scripts]
gs2ew = "gs2ew.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exercises a real GS2 output file (deselect with '-m \"not slow\"')"]
